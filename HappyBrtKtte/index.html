<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>С днём рождения!!!</title>

  <link rel="stylesheet" href="./style/style.css">
</head>
<body>

  <!-- Контейнер для плавающих частиц -->

  <div class="card" id="birthdayCard">
    <div class="garland">
      <span>&#127880;</span>
      <span>&#127881;</span>
      <span>&#127874;</span>
      <span>&#127873;</span>
      <span>&#129395;</span>
      <span>&#10024;</span>
      <span>&#127882;</span>
    </div>

    <h1>С Днём Рождения!!!</h1>
    <div class="name">
      <span class="highlight">Екатерина</span>
    </div>

    <div class="message">
      <p>Пусть этот день будет наполнен радостью, смехом и теплом близких!</p>
      <p>Желаю тебе море цветов, приятных сюрпризов и исполнения самых заветных желаний!</p>
      <p>Пусть каждый новый день приносит вдохновение, удачу и счастье!</p>
    </div>

    <button class="btn" id="celebrateBtn">Запустить салют!!!</button>

    <div class="footer-note">
      <b>От Пашки!!!</b>
    </div>
  </div>

  <script src="./js/app.js"></script>
