<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Для тебя, солнышко)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600;700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
     <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Светящиеся пятна -->
    <div class="glow-spot glow-1"></div>
    <div class="glow-spot glow-2"></div>
    <div class="glow-spot glow-3"></div>

    <!-- Канвас для частиц -->
    <canvas id="particles-canvas"></canvas>

    <div class="container">
        <!-- Заголовок -->
        <div class="title-section">
            <h1>Моей любимой</h1>
            <div class="subtitle">самой нежной и красивой</div>
        </div>

        <!-- Карточка с пожеланиями -->
        <div class="wish-card">
            <div class="wish-text" id="wishDisplay">
                Ты — моё вдохновение и счастье ✨
            </div>
            <div class="button-group">
                <button class="btn btn-primary" id="newWishBtn">
                    <i class="fas fa-heart"></i> Новое пожелание
                </button>
                <button class="btn" id="loveBtn">
                    <i class="fas fa-star"></i> Признание
                </button>
            </div>
            <span class="title_form">От Паси</span>
        </div>

        <!-- Интерактивное сердце -->
        <div class="interactive-heart">
            <button class="heart-btn" id="heartButton">
                <i class="fas fa-heart"></i>
            </button>
            <div class="heart-hint">нажми на сердце</div>
        </div>
    </div>

    <!-- Модальное окно с посланием -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="close-modal" id="closeModalBtn">&times;</button>
            <h2>Я тебя люблю</h2>
            <p id="modalMessage">
                Ты — самое дорогое, что у меня есть. Каждый день с тобой — это подарок. 
                Спасибо, что ты рядом. Ты делаешь мою жизнь ярче и счастливее. 
                Ты моя вселенная)
            </p>
            <div class="signature">навсегда твой Пася</div>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
