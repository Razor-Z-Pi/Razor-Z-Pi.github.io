<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>С Днём отца!</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Звёздный фон -->
    <div class="stars" id="stars"></div>

    <!-- Контейнер для летящих сердечек -->
    <div class="hearts-container" id="heartsContainer"></div>

    <!-- Основная карточка -->
    <main class="card">
        <div class="emoji-string">C праздником:)</div>
        <h1>С днём отца!</h1>
        <p class="message">
            <strong>Папа, ты — мой герой!</strong><br>
            Спасибо за силу, заботу и бесконечную поддержку.<br>
            Ты всегда рядом, и это самое главное. &#10024;
        </p>

        <!-- Интерактивная кнопка -->
        <button class="btn-heart" id="loveBtn">
            Нажми
        </button>

            <div class="timer-label">До конца праздника осталось</div>
            <div class="timer" id="timer">
                <span>00<small>ч</small></span>
                <span>00<small>м</small></span>
                <span>00<small>с</small></span>
            </div>
        </div> -->
    </main>

    <script src="./script.js"></script>
</body>
</html>
