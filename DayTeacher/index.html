<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>С Днём учителя!!!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style/style.css">
</head>
<body>

  <div class="card">
    <!-- Декоративные углы -->
    <div class="corner corner-top-left">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 4C24 4 30 14 38 16C30 18 24 28 24 28C24 28 18 18 10 16C18 14 24 4 24 4Z" fill="#d9a05b"/>
        <path d="M24 12V34" stroke="#b5753a" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="corner corner-bottom-right">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 4C24 4 30 14 38 16C30 18 24 28 24 28C24 28 18 18 10 16C18 14 24 4 24 4Z" fill="#c98a44"/>
        <path d="M24 12V34" stroke="#a3622f" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="greeting-badge">5 октября</div>
    <h1>
      С Днём<br>
      <span>Учителя!</span>
    </h1>
    <div class="subhead">Поздравляю</div>

    <div class="message">
      <p>
        <i>Спасибо</i> за ваше терпение, мудрость и теплоту.
        Вы каждый день зажигаете сердца, ведёте за собой и дарите веру в себя.
      </p>
      <p>
        Пусть осень принесёт вам <i>радость</i>, вдохновение и благодарных учеников!
      </p>
    </div>

    <button class="btn-wish" id="wishBtn">
      <span class="star"></span>
      Нажмите, тут интересно!
    </button>

    <div class="signature">
      <span class="diamond"></span>
      С Праздником:) от Пашки
    </div>
  </div>

  <div class="toast" id="toast">Спасибо большое, что вы есть!</div>

  <script src="./js/app.js"></script>
</body>
</html>
